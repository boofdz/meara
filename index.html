<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>me ara</title>
<meta name="description" content="Paintings by me ara." />
<meta property="og:title" content="me ara" />
<meta property="og:type" content="website" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-head">
    <span class="wordmark">me ara</span>
    <p class="eyebrow">meara000@outlook.com</p>
  </header>

  <main class="gallery-wrap">
    <div class="gallery" id="gallery"></div>
  </main>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Painting viewer" hidden>
    <div class="lightbox-inner" id="lightboxInner">
      <img id="lightboxImg" alt="" />
      <div class="lightbox-bar">
        <button type="button" id="prevBtn">Prev</button>
        <span id="counter"></span>
        <button type="button" id="nextBtn">Next</button>
      </div>
    </div>
    <button type="button" class="lightbox-close" id="closeBtn" aria-label="Close">&times;</button>
  </div>

  <script src="gallery.js"></script>
</body>
</html>
